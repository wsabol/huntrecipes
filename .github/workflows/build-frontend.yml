name: Build Frontend

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - resources/js/**
      - resources/css/**
      - package.json
      - package-lock.json

jobs:

  build:
    name: Build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
